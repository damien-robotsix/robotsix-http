modules:
  - id: core
    description: Core HTTP client primitives
    paths:
      - .github/dependabot.yml
      - .github/workflows/ci.yml
      - .github/workflows/release-please.yml
      - .gitignore
      - .pre-commit-config.yaml
      - .robotsix-mill/config.yaml
      - .robotsix-mill/periodic/**
      - AGENT.md
      - CHANGELOG.md
      - release-please-config.json
      - .release-please-manifest.json
      - LICENSE
      - README.md
      - SECURITY.md
      - docs/modules.yaml
      - pyproject.toml
      - src/robotsix_http/**
      - tests/core/**
      - uv.lock
      - changelog.d/*.md
  - id: tests
    description: Test suite
    paths:
      - tests/__init__.py
