[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "robotsix-http"
dynamic = ["version"]
description = "Shared HTTP retry/backoff library for the robotsix ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27,<1.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
"Programming Language :: Python :: 3.14",
]
keywords = ["robotsix", "http", "retry", "backoff"]

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7",
    "ruff>=0.11",
    "mypy>=1.15",
    "deptry>=0.23",
    "robotsix-modules",
    "towncrier>=24",
]

[tool.towncrier]
package = "robotsix_http"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = ""

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true

[tool.uv.sources]
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules", rev = "f820c04b4e789f2be1a9625fab9f705fbbc51643" }

[tool.coverage.run]
source = ["robotsix_http"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "G", "I", "N", "W", "UP", "B", "SIM", "ARG", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.deptry.per_rule_ignores]
DEP002 = ["httpx"]
DEP003 = ["robotsix_http"]
