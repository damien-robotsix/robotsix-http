[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-http"
version = "0.3.1"
description = "Shared HTTP retry/backoff library for the robotsix ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27,<1.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
"Programming Language :: Python :: 3.14",
]
keywords = ["robotsix", "http", "retry", "backoff"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "deptry>=0.23",
    "robotsix-modules",
]

[tool.uv.sources]
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules", rev = "f820c04b4e789f2be1a9625fab9f705fbbc51643" }

[tool.coverage.run]
source = ["robotsix_http"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "G", "I", "N", "W", "UP", "B", "SIM", "ARG", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.deptry.per_rule_ignores]
DEP002 = ["httpx"]
DEP003 = ["robotsix_http"]
