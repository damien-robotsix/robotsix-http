repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Scans staged changes for leaked secrets that detect-private-key's
      # PEM/RSA/ECDSA-only matching cannot catch. CI runs TruffleHog through
      # the shared python-security.yml since --no-verify can skip hooks.
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
        exclude: '\.secrets\.baseline$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [--strict, src/]
  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry
        args: [src/, tests/]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
