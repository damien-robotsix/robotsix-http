repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans staged changes for leaked secrets (OAuth bearer/access/refresh
      # tokens, client secrets, API keys) that detect-private-key's
      # PEM/RSA/ECDSA-only matching cannot catch. Runs `gitleaks git
      # --staged`; CI runs the full-history backstop since --no-verify can
      # skip pre-commit hooks.
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--strict, src/]
  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry
        args: [src/, tests/]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.5.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
