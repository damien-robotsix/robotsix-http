name: Lint Workflows

on:
  push:
  pull_request:

# Read-only: actionlint and zizmor only inspect the checked-out workflow files.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows (actionlint + zizmor)
    permissions:
      contents: read  # check out the repo to lint .github/workflows/
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      run-actionlint: true
      run-zizmor: true
