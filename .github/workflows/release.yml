name: Auto Release

on:
  push:
    branches: [main]

jobs:
  auto-release:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/auto-release.yml@e94a9aad6c4d6753c860520ba49b6a94a59ceb55
    with:
      python-version: "3.14"
      uv-version: "0.11.22"
      app-id: ${{ vars.AUTO_RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.AUTO_RELEASE_APP_PRIVATE_KEY }}
