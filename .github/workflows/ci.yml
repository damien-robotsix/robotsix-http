name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No workflow-level default; every job grants only what it needs.
permissions: {}

jobs:
  ci:
    permissions:
      contents: read  # check out the repo to lint, type-check and test it
      security-events: write  # audit-sarif uploads the uv audit SARIF to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.14"
      uv-version: "0.11.22"
      cov-package: "robotsix_http"
      coverage-threshold: "80"
      install-extras: ""
      run-deptry: true
      run-audit: true
      audit-sarif: true
      check-lock: true
      run-bandit: true
      bandit-severity: "medium"
      mypy-advisory: false
      pytest-args: ""
      pytest-numprocesses: "auto"
      runs-on: "ubuntu-latest"

  secret-scan:
    permissions:
      contents: read  # check out the repo for the TruffleHog secret scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.14"
      uv-version: "0.11.22"
      install-extras: ""
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"
      run-pip-audit: false  # python-ci v1.5.0 run-audit + audit-sarif already cover this

  commit-lint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.22"

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: Validate PR commit messages
        # SHAs are passed through env, not expanded into the script, so no
        # event-supplied value is ever interpolated into shell code.
        run: uv run cz check --rev-range "${BASE_SHA}..${HEAD_SHA}"
        env:
          UV_PROJECT_ENVIRONMENT: system
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
