name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c
    with:
      python-version: "3.14"
      uv-version: "0.11.22"
      cov-package: "robotsix_http"
      coverage-threshold: "80"
      install-extras: ""
      run-deptry: true
      run-audit: false
      run-bandit: true
      bandit-severity: "medium"
      mypy-advisory: false
      pytest-args: ""
      pytest-numprocesses: "auto"
      runs-on: "ubuntu-latest"
    secrets: inherit

  uv-audit:
    name: UV Audit (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.22"

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: "1"

      - name: Run uv audit
        run: uv audit --frozen --output-format sarif > uv-audit-results.sarif
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: Upload SARIF results
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v3
        with:
          sarif_file: uv-audit-results.sarif
          category: uv-audit
