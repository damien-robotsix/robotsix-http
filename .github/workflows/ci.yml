name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@2de56a85055b60d0f01c406342eda081e68c0c8b
    with:
      python-version: "3.14"
      uv-version: "0.11.22"
      cov-package: "robotsix_http"
      coverage-threshold: "80"
      install-extras: ""
      run-deptry: true
      run-audit: false
      run-bandit: true
      bandit-severity: "medium"
      mypy-advisory: false
      pytest-args: ""
      pytest-numprocesses: "auto"
      runs-on: "ubuntu-latest"
    secrets: inherit

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          # Keep in sync with the gitleaks `rev` in .pre-commit-config.yaml.
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from
          # the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Pinned here
          # so verification does not trust a second download from the same origin.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        # Non-bypassable backstop: pre-commit hooks can be skipped with
        # `git commit --no-verify`, so CI re-scans the entire history.
        run: gitleaks git . --redact --verbose

  commit-lint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.22"

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: Validate PR commit messages
        run: >-
          uv run cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        env:
          UV_PROJECT_ENVIRONMENT: system

  uv-audit:
    name: UV Audit (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.22"

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: "1"

      - name: Run uv audit
        run: uv audit --frozen --output-format sarif > uv-audit-results.sarif
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: Upload SARIF results
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v3
        with:
          sarif_file: uv-audit-results.sarif
          category: uv-audit
