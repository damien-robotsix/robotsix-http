name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No workflow-level default; every job grants only what it needs.
permissions: {}

jobs:
  ci:
    permissions:
      contents: read  # check out the repo to lint, type-check and test it
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@2de56a85055b60d0f01c406342eda081e68c0c8b
    with:
      python-version: "3.14"
      uv-version: "0.11.22"
      cov-package: "robotsix_http"
      coverage-threshold: "80"
      install-extras: ""
      run-deptry: true
      run-audit: false
      run-bandit: true
      bandit-severity: "medium"
      mypy-advisory: false
      pytest-args: ""
      pytest-numprocesses: "auto"
      runs-on: "ubuntu-latest"

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          # Keep in sync with the gitleaks `rev` in .pre-commit-config.yaml.
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from
          # the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Pinned here
          # so verification does not trust a second download from the same origin.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        # Non-bypassable backstop: pre-commit hooks can be skipped with
        # `git commit --no-verify`, so CI re-scans the entire history.
        run: gitleaks git . --redact --verbose

  commit-lint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.22"

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: Validate PR commit messages
        # SHAs are passed through env, not expanded into the script, so no
        # event-supplied value is ever interpolated into shell code.
        run: uv run cz check --rev-range "${BASE_SHA}..${HEAD_SHA}"
        env:
          UV_PROJECT_ENVIRONMENT: system
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  uv-audit:
    name: UV Audit (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repo and read uv.lock
      security-events: write  # upload the uv audit SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.22"

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: "1"

      - name: Run uv audit
        run: uv audit --frozen --output-format sarif > uv-audit-results.sarif
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: Upload SARIF results
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3
        with:
          sarif_file: uv-audit-results.sarif
          category: uv-audit
